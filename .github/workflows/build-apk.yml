name: Build Dukan Saathi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Zip ho to khol do
        run: |
          find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | while read -r z; do
            echo "Unzip: $z"
            unzip -o -q "$z" -d unzipped_app
          done

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Project folder dhundo
        id: find
        run: |
          FILE=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts repo me mili hi nahi - app ka zip upload karo"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Debug APK build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: APK upload
        uses: actions/upload-artifact@v4
        with:
          name: DukanSaathi-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
